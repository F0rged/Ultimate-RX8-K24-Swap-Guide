<section class="build-config-bar" aria-label="Build configuration">
  <div class="build-config-bar__summary">
    <strong>Your build</strong>
    <span id="build-config-summary">Build not configured - variant guidance is not being filtered.</span>
  </div>
  <div class="build-config-bar__actions">
    <button type="button" class="build-config-button" id="build-config-edit">Configure build</button>
    <button type="button" class="build-config-button" id="build-config-share">Copy build link</button>
    <label class="build-config-mode-label" for="build-config-mode">View</label>
    <select id="build-config-mode" class="build-config-mode">
      <option value="context">My build + alternatives</option>
      <option value="mine">My build only</option>
      <option value="all">Show all variants</option>
    </select>
    <label class="build-config-mode-label" for="build-config-alert-mode">Build alerts</label>
    <select id="build-config-alert-mode" class="build-config-mode">
      <option value="relevant">Relevant</option>
      <option value="none">None</option>
    </select>
  </div>
  <span id="build-config-issue-count" class="build-config-issue-count" hidden></span>
</section>

<div id="build-config-alerts" class="build-config-alerts" aria-live="polite"></div>

<dialog id="build-config-dialog" class="build-config-dialog">
  <form method="dialog" id="build-config-form">
    <div class="build-config-dialog__header">
      <div>
        <p class="guide-kicker">Build profile</p>
        <h2>Configure your RX-8 K-swap</h2>
      </div>
      <button type="button" class="build-config-close" id="build-config-cancel" aria-label="Close">&times;</button>
    </div>

    <p class="build-config-help">
      Choose what you know. Blank fields stay unresolved so the guide will not silently hide guidance that could still apply.
    </p>

    <div id="build-config-fields"></div>

    <div id="build-config-dialog-alerts" class="build-config-alerts" aria-live="polite"></div>

    <div class="build-config-dialog__actions">
      <button type="button" class="build-config-button build-config-button--danger" id="build-config-clear">Clear build</button>
      <span class="build-config-dialog__spacer"></span>
      <button type="button" class="build-config-button" id="build-config-cancel-bottom">Cancel</button>
      <button type="submit" class="build-config-button build-config-button--primary">Save build</button>
    </div>
  </form>
</dialog>
