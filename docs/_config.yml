title: RX-8 K-Series Swap Guide
description: Research-backed guide to Honda K-series swaps across Mazda RX-8 variants, with model-year and engine-specific compatibility notes.
url: "http://rx8-kswap.importfanatik.com"
baseurl: ""
repository: F0rged/Ultimate-RX8-K24-Swap-Guide
theme: minima
markdown: kramdown
plugins:
  - jekyll-seo-tag
header_pages:
  - index.md
  - build-guide/index.md
  - reference/index.md

defaults:
  - scope:
      path: "build-guide"
      type: "pages"
    values:
      guide_header: true
      area_title: Build Guide
      area_url: /build-guide/
  - scope:
      path: "reference"
      type: "pages"
    values:
      guide_header: true
      area_title: Reference Material
      area_url: /reference/

giscus:
  enabled: true
  repo: F0rged/Ultimate-RX8-K24-Swap-Guide
  repo_id: "R_kgDOTyXbHA"
  category: "Announcements"
  category_id: "DIC_kwDOTyXbHM4DC-Ez"
  mapping: pathname
  strict: "0"
  input_position: top
  theme: light
