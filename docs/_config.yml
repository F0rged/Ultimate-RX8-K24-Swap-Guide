title: RX-8 K24 Swap Guide
description: Research-backed sequential guide for K24 swapping a Mazda RX-8, with 2009 S2 and JDM K24A/RBB notes.
url: "http://rx8-kswap.importfanatik.com"
baseurl: ""
repository: F0rged/Ultimate-RX8-K24-Swap-Guide
theme: minima
markdown: kramdown
plugins:
  - jekyll-seo-tag
header_pages:
  - index.md
  - build-guide/index.md
  - reference/index.md

defaults:
  - scope:
      path: "build-guide"
      type: "pages"
    values:
      guide_header: true
      area_title: Build Guide
      area_url: /build-guide/
  - scope:
      path: "reference"
      type: "pages"
    values:
      guide_header: true
      area_title: Reference Material
      area_url: /reference/

giscus:
  enabled: false
  repo: F0rged/Ultimate-RX8-K24-Swap-Guide
  repo_id: ""
  category: "General"
  category_id: ""
  mapping: pathname
